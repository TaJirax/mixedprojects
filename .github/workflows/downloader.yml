# Blue Knight Downloader — every platform it runs on.
#
# PyInstaller cannot cross-compile: a Linux binary has to be produced on Linux
# and a macOS bundle on macOS. That is the whole reason this workflow exists
# rather than a script someone runs on their own machine.
#
# The repository at the root holds a second, unrelated app (White Booster) with
# its own release.yml on the "v*" tags. This one answers to "downloader-v*" so
# the two never fire on each other's releases.
name: Downloader

on:
  push:
    branches: [main]
    tags: ["downloader-v*"]
    paths: ["spoty/**", ".github/workflows/downloader.yml"]
  pull_request:
    paths: ["spoty/**", ".github/workflows/downloader.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # The engine's own checks, once, before the platform runners package it.
  # --------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Path and platform checks
        working-directory: spoty
        run: |
          python blueknight_paths.py
          python pyshell.py

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   target: windows-x64 }
          - { os: ubuntu-24.04,     target: linux-x64 }
          - { os: macos-14,         target: macos-arm64 }  # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install Python dependencies
        working-directory: spoty
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pywebview draws through WebKitGTK on Linux and fails at import without
      # it. On Windows it uses WebView2 and on macOS WKWebView, both built in.
      # Install the Python dependencies first: after PYTHONPATH is exported,
      # pip would otherwise see Ubuntu's protected system copy of itself.
      - name: Install WebKitGTK
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-webkit2-4.1 \
            libcairo2-dev libgirepository1.0-dev pkg-config
          # setup-python is installed under /opt and does not automatically
          # see Ubuntu's ABI-compatible python3-gi package. Expose that package
          # both to the build-time probe and to PyInstaller's import analysis.
          echo "PYTHONPATH=/usr/lib/python3/dist-packages" >> "$GITHUB_ENV"

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: spoty
        shell: pwsh
        run: ./build_portable.ps1

      - name: Build (Linux and macOS)
        if: matrix.os != 'windows-latest'
        working-directory: spoty
        run: bash ./build_portable.sh

      # A binary that cannot start is not a build. Run the frozen executable,
      # not the source interpreter, so missing PyInstaller data is caught.
      - name: Smoke test the Windows package
        if: matrix.os == 'windows-latest'
        working-directory: spoty
        shell: pwsh
        run: |
          $process = Start-Process ./release/SpotifyDownloader.exe `
            -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          exit $process.ExitCode

      - name: Smoke test the Linux package
        if: startsWith(matrix.os, 'ubuntu')
        working-directory: spoty
        run: ./release/SpotifyDownloader --self-test

      - name: Smoke test the macOS package
        if: startsWith(matrix.os, 'macos')
        working-directory: spoty
        run: |
          ./release/SpotifyDownloader.app/Contents/MacOS/SpotifyDownloader --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: blueknight-${{ matrix.target }}
          path: |
            spoty/release/*.zip
            spoty/release/*.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Android. FFmpeg is cross-compiled here rather than downloaded: nothing
  # publishes an FFmpeg executable for Android any more, and yt-dlp needs a
  # real binary to launch, not a library binding.
  # --------------------------------------------------------------------------
  android-native:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the x86 assembler
        if: startsWith(matrix.abi, 'x86')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm

      # Each architecture has its own cache and isolated compiler work tree.
      # Reusing either across ABIs can silently put ARM objects in an x86 APK.
      - name: Cache FFmpeg for ${{ matrix.abi }}
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: spoty/android/app/src/main/jniLibs/${{ matrix.abi }}
          key: ffmpeg-android-${{ matrix.abi }}-${{ hashFiles('spoty/android/build_ffmpeg_android.sh') }}

      - name: Build FFmpeg and LAME for ${{ matrix.abi }}
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          ABI: ${{ matrix.abi }}
        working-directory: spoty/android
        run: bash ./build_ffmpeg_android.sh

      - name: Verify native executables
        env:
          ABI: ${{ matrix.abi }}
        working-directory: spoty/android
        run: |
          test -s "app/src/main/jniLibs/$ABI/libffmpeg.so"
          test -s "app/src/main/jniLibs/$ABI/libffprobe.so"
          file "app/src/main/jniLibs/$ABI/libffmpeg.so"
          file "app/src/main/jniLibs/$ABI/libffprobe.so"

      - uses: actions/upload-artifact@v4
        with:
          name: blueknight-native-${{ matrix.abi }}
          path: spoty/android/app/src/main/jniLibs/${{ matrix.abi }}/*
          if-no-files-found: error

  android:
    needs: [check, android-native]
    strategy:
      fail-fast: false
      matrix:
        target: [universal, arm64-v8a, armeabi-v7a, x86, x86_64]
    runs-on: ubuntu-24.04
    env:
      # A step's `if` cannot read the secrets context, so the one thing that
      # needs deciding — is there a keystore — is resolved once, here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a build-time interpreter matching the target version.
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/download-artifact@v4
        with:
          name: blueknight-native-arm64-v8a
          path: spoty/android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: blueknight-native-armeabi-v7a
          path: spoty/android/app/src/main/jniLibs/armeabi-v7a
      - uses: actions/download-artifact@v4
        with:
          name: blueknight-native-x86
          path: spoty/android/app/src/main/jniLibs/x86
      - uses: actions/download-artifact@v4
        with:
          name: blueknight-native-x86_64
          path: spoty/android/app/src/main/jniLibs/x86_64

      # Signing is optional so that a fork, or a pull request from one, still
      # produces an installable APK. Without the secrets the release build is
      # signed with the debug key instead of failing.
      - name: Write the signing configuration
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: spoty/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Require stable signing for a tagged release
        if: startsWith(github.ref, 'refs/tags/downloader-v') && env.HAS_KEYSTORE != 'true'
        working-directory: spoty/android
        run: |
          test -f ../../keystore/whitebooster.jks || {
            echo "Tagged Android releases require ANDROID_* secrets or the repository signer." >&2
            exit 1
          }

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        working-directory: spoty/android
        run: chmod +x gradlew

      - name: Lint and run Android unit tests
        if: matrix.target == 'universal'
        working-directory: spoty/android
        run: ./gradlew lintRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: Assemble the ${{ matrix.target }} APK
        working-directory: spoty/android
        run: ./gradlew -PtargetAbi=${{ matrix.target }} assembleRelease --no-daemon --stacktrace

      - name: Name and verify the APK
        working-directory: spoty/android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk \
             "out/BlueKnightDownloader-android-${{ matrix.target }}.apk"
          python verify_apk.py \
             "out/BlueKnightDownloader-android-${{ matrix.target }}.apk" \
             "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: blueknight-android-${{ matrix.target }}
          path: spoty/android/out/*.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/downloader-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.apk
          generate_release_notes: true
